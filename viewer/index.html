<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="{{CSP}}">
  <link rel="icon" href="data:,">
  <title>DocViewKit Omni</title>
  <style nonce="{{NONCE}}">
    html, body, docviewkit-viewer { width: 100%; height: 100%; margin: 0; }
    body { padding: 0; overflow: hidden; background: var(--vscode-editor-background, #fff); }
  </style>
</head>
<body>
  <docviewkit-viewer></docviewkit-viewer>
  <script nonce="{{NONCE}}">
    {{HOST_BOOTSTRAP}}
    const initial = globalThis.docViewKitInitial;
    if (typeof initial?.background === "string") {
      document.body.style.background = initial.background;
      document.querySelector("docviewkit-viewer").style.setProperty("--dv-background", initial.background);
    }
  </script>
  <script nonce="{{NONCE}}" type="module" src="{{HOST_SCRIPT}}"></script>
</body>
</html>
