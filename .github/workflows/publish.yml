name: Publish

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish.yml]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release vX.Y.Z tag to publish
        required: true
        type: string
      target:
        description: Marketplace target
        required: true
        default: all
        type: choice
        options:
          - all
          - vscode
          - vs-marketplace
          - openvsx
          - vsix
          - jetbrains

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Check release version
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(node -p "require('./vscode/package.json').version")" = "$version"
          test "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' jetbrains/build.gradle.kts)" = "$version"
      - run: npm test
      - run: npm run test:browser
        env:
          DOCVIEWKIT_CHROME: /usr/bin/google-chrome
      - run: xvfb-run -a npm run test:vscode-host
      - run: npm run package:vscode
      - run: ./jetbrains/gradlew -p jetbrains clean test buildPlugin verifyPluginStructure verifyPlugin
      - run: npm run test:packages
      - name: Checksum VSIX
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          cd vscode
          sha256sum "docviewkit-omni-${TAG#v}.vsix" > "docviewkit-omni-${TAG#v}.vsix.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-packages
          path: |
            vscode/*.vsix
            vscode/*.vsix.sha256
            jetbrains/build/distributions/*.zip
          if-no-files-found: error

  vscode:
    needs: vsix
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'vscode' || inputs.target == 'vs-marketplace' }}
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vscode-release-package
          path: marketplace-packages/vscode
      - name: Publish VS Code extension
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          cd marketplace-packages/vscode
          sha256sum -c "docviewkit-omni-${TAG#v}.vsix.sha256"
          npx --no-install vsce publish --packagePath "docviewkit-omni-${TAG#v}.vsix" --skip-duplicate

  openvsx:
    needs: vsix
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'vscode' || inputs.target == 'openvsx' }}
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vscode-release-package
          path: marketplace-packages/vscode
      - name: Publish Open VSX extension
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          cd marketplace-packages/vscode
          sha256sum -c "docviewkit-omni-${TAG#v}.vsix.sha256"
          npx --no-install ovsx publish "docviewkit-omni-${TAG#v}.vsix" --skip-duplicate

  vsix:
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'vscode' || inputs.target == 'vs-marketplace' || inputs.target == 'openvsx' || inputs.target == 'vsix' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marketplace-packages
          path: marketplace-packages
      - name: Publish VSIX release assets
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd marketplace-packages/vscode
          file="docviewkit-omni-${TAG#v}.vsix"
          sha256sum -c "$file.sha256"
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if printf '%s\n' "$assets" | grep -Fxq "$file"; then
            rm -- "$file" "$file.sha256"
            gh release download "$TAG" --pattern "$file" --pattern "$file.sha256" --clobber
            sha256sum -c "$file.sha256"
          else
            gh release upload "$TAG" "$file" "$file.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-release-package
          path: marketplace-packages/vscode/*
          if-no-files-found: error

  jetbrains:
    needs: build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'jetbrains' }}
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Publish JetBrains plugin
        run: ./jetbrains/gradlew -p jetbrains publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
